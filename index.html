<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Mindless</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Geist:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Courier+Prime:wght@400;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an app shell. Desktop = left rail + content; phone = content + bottom tab bar.
   Softer pass: rounder shapes, tinted shadows instead of borders, one accent per theme.
   Theme colors are injected at runtime (six palettes x light/dark); these are the Sage defaults. */
:root{
  --bg:#F1F4F1; --surface:#FBFCFA; --sunk:#E6ECE7; --ink:#263330; --ink-2:#4F5D58; --ink-3:#76837E;
  --line:#DDE4DF; --line-2:#C9D3CC;
  --accent:#4F7D69; --accent-ink:#FFFFFF; --accent-soft:#E0EBE4; --accent-line:#A9C7B9; --accent-text:#3B6452;
  --map-bg:#E6ECE7; --map-street:#FBFCFA; --map-major:#FBFCFA;
  --warn:#9A5A1B; --warn-soft:color-mix(in srgb, #E9A35A 22%, var(--surface)); --bad:#A93A2F;
  --water:color-mix(in srgb, #6FA3BF 30%, var(--bg)); --park:color-mix(in srgb, #7DB38A 26%, var(--bg)); --map-label:var(--ink-3);
  --shadow:0 1px 2px color-mix(in srgb, var(--ink) 6%, transparent), 0 10px 30px -18px color-mix(in srgb, var(--ink) 35%, transparent);
  --shadow-soft:0 1px 2px color-mix(in srgb, var(--ink) 5%, transparent), 0 6px 20px -14px color-mix(in srgb, var(--ink) 30%, transparent);
  --display:'Inter Tight', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body:'Inter Tight', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --label:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --display-w:700; --display-ls:-.035em; --label-case:uppercase; --label-ls:.06em; --label-size:.88;
  --r-s:12px; --r-m:18px; --r-l:26px;
  --rail:236px; --tabbar:66px;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131816; --surface:#1A211F; --sunk:#212926; --ink:#E4EBE7; --ink-2:#AAB7B1; --ink-3:#7F8C86;
  --line:#2A3330; --line-2:#37423E;
  --accent:#8DBBA6; --accent-ink:#102019; --accent-soft:#1E3029; --accent-line:#38594B; --accent-text:#A9D1BF;
  --map-bg:#1A211F; --map-street:#2A3330; --map-major:#37423E; --warn:#E6AC6E; --bad:#EE8B7F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1A211F; --sunk:#212926; --ink:#E4EBE7; --ink-2:#AAB7B1; --ink-3:#7F8C86;
  --line:#2A3330; --line-2:#37423E;
  --accent:#8DBBA6; --accent-ink:#102019; --accent-soft:#1E3029; --accent-line:#38594B; --accent-text:#A9D1BF;
  --map-bg:#1A211F; --map-street:#2A3330; --map-major:#37423E; --warn:#E6AC6E; --bad:#EE8B7F;
  color-scheme:dark;
}
:root[data-appearance="dark"]{--warn:#E6AC6E; --bad:#EE8B7F}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .4s var(--ease), color .4s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:24px 16px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 12px 24px;font-family:var(--display);font-weight:var(--display-w);font-size:22px;letter-spacing:var(--display-ls);color:var(--ink)}
.brand-mark{width:26px;height:26px;color:var(--accent)}
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;text-decoration:none;color:var(--ink-2);font-weight:500;min-height:46px;transition:background .2s, color .2s}
.nav-link:hover{background:var(--sunk);color:var(--ink)}
.nav-link[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-soft)}
.nav-link[aria-current="page"] svg.i{color:var(--accent)}
.nav-link .count{margin-left:auto;font-size:12px;color:var(--ink-3);background:var(--sunk);padding:1px 8px;border-radius:999px}
.rail-foot{margin-top:auto;padding:14px 12px 0;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.sync-dot.off{background:var(--line-2)}
.theme-mini{display:flex;align-items:center;gap:8px;margin-top:10px;border:0;background:var(--surface);box-shadow:var(--shadow-soft);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--ink-2);text-align:left;min-height:40px}
.theme-mini:hover{color:var(--ink)}
.theme-mini svg.i{color:var(--accent)}

main{min-width:0;padding-block:30px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1140px;margin:0 auto;padding:0 clamp(0px, 2vw, 28px)}
.desk-only{}

@media (max-width: 820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;flex-direction:row;justify-content:space-around;gap:0;padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));background:var(--surface);box-shadow:0 -8px 24px -18px color-mix(in srgb, var(--ink) 40%, transparent)}
  .brand,.rail-foot{display:none}
  .nav-link{flex-direction:column;gap:3px;padding:6px 4px;font-size:11.5px;flex:1;justify-content:center;min-height:52px;border-radius:12px}
  .nav-link[aria-current="page"]{box-shadow:none;background:var(--accent-soft);color:var(--accent-text)}
  .nav-link .count{display:none}
  main{padding-block:14px calc(var(--tabbar) + 40px + env(safe-area-inset-bottom, 0px))}
  .mobile-top{display:flex!important}
  .desk-only{display:none!important}
}
.mobile-top{display:none;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
.mobile-top .brand{display:flex;padding:0;font-size:20px}

/* ---------- type ---------- */
.eyebrow{font-size:calc(14px * var(--label-size));color:var(--ink-2);font-weight:500}
.eyebrow,.nn-k,.fact .k,.tl .time,.ml-area,.inbox li.inbox-h,.nn-clock > span,.fc-lbl{font-family:var(--label);text-transform:var(--label-case);letter-spacing:var(--label-ls)}
h1,h2,h3{margin:0;text-wrap:balance}
.h-display{font-family:var(--display);font-weight:var(--display-w);letter-spacing:var(--display-ls);line-height:1.02;font-size:clamp(36px, 5.4vw, 62px)}
.h-display .soft{color:var(--ink-3)}
.h-page{font-family:var(--display);font-weight:var(--display-w);letter-spacing:var(--display-ls);font-size:clamp(27px, 3.4vw, 36px);line-height:1.1}
.h-sec{font-size:15.5px;font-weight:600;letter-spacing:-.005em}
.lede{color:var(--ink-2);max-width:62ch;margin:10px 0 0;font-size:16px;line-height:1.6}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);font-weight:500;font-size:14.5px;transition:transform .2s var(--ease), background .2s, box-shadow .2s;white-space:nowrap;text-decoration:none}
.btn:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.btn:active{transform:scale(.97)}
.btn.primary,.btn.accent{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px -10px color-mix(in srgb, var(--accent) 80%, transparent)}
.btn.primary:hover,.btn.accent:hover{background:color-mix(in srgb, var(--accent) 88%, var(--ink))}
.btn.ghost{box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:0;background:transparent;color:var(--ink-3);flex:none}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn[aria-pressed="true"]{color:var(--accent-text);background:var(--accent-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label,.field .lbl{font-size:13.5px;font-weight:500;color:var(--ink-2)}
.field .help{font-size:12.5px;color:var(--ink-3)}
.field .err{font-size:12.5px;color:var(--bad)}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:11px 14px;border-radius:var(--r-s);border:0;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface)}
textarea.input{resize:vertical;line-height:1.6;min-height:150px}
.input:focus{outline:2px solid var(--accent);outline-offset:0;box-shadow:none}
.input[aria-invalid="true"]{box-shadow:inset 0 0 0 1.5px var(--bad)}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2);min-height:36px;display:inline-flex;align-items:center;gap:6px;transition:background .2s, color .2s}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-soft)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:12.5px;line-height:1.45;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent-text)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip button{border:0;background:transparent;padding:0;margin-left:2px;color:inherit;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%}
.chip button:hover{background:color-mix(in srgb, currentColor 16%, transparent)}
.chip svg.i{width:13px;height:13px}

.panel{background:var(--surface);border-radius:var(--r-l);padding:22px;box-shadow:var(--shadow-soft)}
.panel + .panel{margin-top:14px}

/* ---------- theme picker ---------- */
.pick-h{font-size:13.5px;font-weight:500;color:var(--ink-2);margin:18px 0 10px}
.font-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:10px}
@media (max-width: 420px){ .font-grid,.theme-grid{grid-template-columns:repeat(2, minmax(0,1fr))} .fc-aa{font-size:20px} .font-card{padding:12px 12px 10px} }
.font-card{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px 14px 12px;border-radius:var(--r-m);border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:transform .25s var(--ease), box-shadow .2s}
.font-card:hover{transform:translateY(-2px)}
.font-card[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.fc-aa{font-size:24px;line-height:1.1;color:var(--ink);margin-bottom:4px}
.fc-lbl{font-size:12px;color:var(--ink-3);margin-bottom:8px}
.font-card .tc-name,.font-card .tc-sub{padding:0}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(148px, 1fr));gap:12px}
.theme-card{display:flex;flex-direction:column;gap:1px;text-align:left;padding:8px 8px 12px;border-radius:var(--r-m);border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:transform .25s var(--ease), box-shadow .2s}
.theme-card:hover{transform:translateY(-2px)}
.theme-card[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.tc-prev{display:block;position:relative;height:70px;border-radius:12px;background:var(--tb);margin-bottom:8px;overflow:hidden}
.tc-bar{position:absolute;left:10px;right:38px;top:12px;height:24px;border-radius:8px;background:var(--ts);display:flex;align-items:center;padding-left:7px}
.tc-chip{width:24px;height:8px;border-radius:999px;background:var(--tsoft)}
.tc-line{position:absolute;left:10px;top:45px;width:52%;height:6px;border-radius:3px;background:var(--ti);opacity:.8}
.tc-line.short{top:55px;width:32%;opacity:.35}
.tc-dot{position:absolute;right:10px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--ta)}
.tc-name{font-weight:600;font-size:14px;padding:0 4px}
.tc-sub{font-size:12.5px;color:var(--ink-3);padding:0 4px}

/* ---------- setup ---------- */
.setup-top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1040px}
.progress{width:min(320px, 60vw);height:6px;border-radius:999px;background:var(--sunk);margin-top:8px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .5s var(--ease)}
.setup{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:48px;align-items:start;max-width:1040px}
.setup-body{animation:rise .5s var(--ease) both}
.steps-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:28px}
.steps-nav button{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:transparent;padding:12px;border-radius:14px;color:var(--ink-3)}
.steps-nav button:hover{background:var(--sunk)}
.steps-nav .n{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-2);display:grid;place-items:center;font-size:12px;flex:none;margin-top:1px}
.steps-nav .n svg.i{width:14px;height:14px}
.steps-nav button[aria-current="step"]{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-soft)}
.steps-nav button[aria-current="step"] .n{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.steps-nav button.done .n{background:var(--accent-soft);box-shadow:none;color:var(--accent-text)}
.steps-nav b{display:block;font-weight:600;font-size:14.5px}
.steps-nav span.s{font-size:13px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:12px}
.choice{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 18px;border-radius:var(--r-m);border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);min-height:44px;transition:box-shadow .2s, transform .25s var(--ease)}
.choice:hover{transform:translateY(-1px)}
.choice[aria-pressed="true"],.choice[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb, var(--accent-soft) 45%, var(--surface))}
.choice svg.i{color:var(--accent)}
.choice b{font-weight:600}
.choice .muted{font-size:13px}
.cal-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.cal-row:first-child{border-top:0;padding-top:0}
.cal-row:last-child{padding-bottom:0}
.cal-logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--sunk);font-weight:600;font-size:13px;flex:none}
.cal-row .grow{flex:1;min-width:0}
.form-grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:18px}
.form-grid .span{grid-column:1 / -1}
.curve{width:100%;height:46px;margin-top:4px}
.curve path{fill:none;stroke:var(--ink-3);stroke-width:1.8;stroke-linecap:round}
.choice[aria-pressed="true"] .curve path{stroke:var(--accent)}
.range-row{display:flex;align-items:center;gap:14px}
.range-row input{flex:1;accent-color:var(--accent)}
.switch{position:relative;width:46px;height:28px;border-radius:999px;border:0;background:var(--line-2);flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .3s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.setup-foot{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}

@media (max-width: 820px){
  .setup{grid-template-columns:minmax(0,1fr);gap:16px}
  .steps-nav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .steps-nav button{flex:none;padding:8px 12px}
  .steps-nav span.s{display:none}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .setup-foot{position:sticky;bottom:calc(var(--tabbar) + 10px + env(safe-area-inset-bottom, 0px));background:color-mix(in srgb, var(--bg) 92%, transparent);padding:10px 0;margin-top:20px}
}

/* ---------- add tasks ---------- */
.add-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:26px}
.tabs{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--sunk);margin-bottom:20px;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 14px;display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:500;border-radius:999px;white-space:nowrap;min-height:40px;transition:background .2s, color .2s}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-soft)}
.tabs button[aria-selected="true"] svg.i{color:var(--accent)}
#addPane{animation:rise .35s var(--ease) both}
.parsed{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.parsed-row{display:flex;flex-direction:column;gap:7px;padding:12px 14px;border-radius:var(--r-m);background:var(--bg)}
.parsed-row .t{font-weight:500}
.parsed-row .chips{display:flex;flex-wrap:wrap;gap:6px}
.mic{width:116px;height:116px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;margin:8px auto 14px;position:relative;transition:transform .25s var(--ease), background .25s}
.mic svg.i{width:34px;height:34px}
.mic:active{transform:scale(.96)}
.mic.rec{background:var(--accent);color:var(--accent-ink)}
.mic.rec::before,.mic.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--accent);opacity:.5;animation:ring 1.8s var(--ease) infinite}
.mic.rec::after{animation-delay:.9s}
@keyframes ring{from{transform:scale(.92);opacity:.6}to{transform:scale(1.3);opacity:0}}
.transcript{min-height:88px;padding:16px 18px;border-radius:var(--r-m);background:var(--bg);color:var(--ink-2);font-size:15.5px}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.import-src{padding:14px 0;border-top:1px solid var(--line)}
.import-src:first-child{border-top:0;padding-top:0}
.import-item{display:flex;align-items:center;gap:12px;padding:8px 0}
.import-item input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.import-item .grow{flex:1;min-width:0}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.inbox{list-style:none;margin:0;padding:0}
.inbox li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.inbox li.inbox-h{border:0;padding:16px 0 2px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.inbox li.inbox-h:first-child{padding-top:8px}
.inbox li.inbox-h + li{border-top:0}
.inbox .grow{flex:1;min-width:0}
.inbox .t{font-weight:500}

<script>
// ===== Mindless planning engine (pure functions, no DOM) =====
const PLACES = {
  home:    { name: 'Home', addr: '41 Hazel Ct', x: 16, y: 76, area: 'Elm Street', open: 0, close: 1440 },
  work:    { name: 'Linden Cowork', addr: '214 Linden Ave', x: 56, y: 28, area: 'Downtown', open: 420, close: 1320 },
  pharmacy:{ name: 'Corner Pharmacy', addr: '9 State St', x: 64, y: 38, area: 'Downtown', open: 540, close: 1080 },
  post:    { name: 'Post Office', addr: '213 N Tioga St', x: 61, y: 20, area: 'Downtown', open: 540, close: 1020 },
  cafe:    { name: 'Café Alder', addr: '118 Green St', x: 48, y: 42, area: 'Downtown', open: 420, close: 1140 },
  library: { name: 'Fall Creek Library', addr: '101 E Green St', x: 42, y: 30, area: 'Downtown', open: 600, close: 1200 },
  market:  { name: 'Greenway Market', addr: '702 Elm St', x: 30, y: 64, area: 'Elm Street', open: 480, close: 1260 },
  cleaner: { name: 'Bright Press Cleaners', addr: '640 Elm St', x: 25, y: 57, area: 'Elm Street', open: 420, close: 1140 },
  paper:   { name: 'Paperleaf Stationers', addr: '27 Aurora St', x: 53, y: 35, area: 'Downtown', open: 600, close: 1080 },
  friend:  { name: "Marisol's place", addr: '12 Hazel Ct', x: 20, y: 70, area: 'Elm Street', open: 0, close: 1440 },
  gym:     { name: 'Northside Gym', addr: '1290 Lake Rd', x: 84, y: 14, area: 'Northside', open: 330, close: 1320 },
  dentist: { name: 'Riverside Dental', addr: '55 Inlet Way', x: 76, y: 60, area: 'Riverside', open: 480, close: 1020 },
};

const MODES = {
  walk:    { label: 'Walk',    perUnit: 0.42, fixed: 0 },
  bike:    { label: 'Bike',    perUnit: 0.15, fixed: 2 },
  transit: { label: 'Transit', perUnit: 0.12, fixed: 7 },
  drive:   { label: 'Drive',   perUnit: 0.08, fixed: 5 },
};

const PEAKS = { morning: [480, 720], afternoon: [780, 990], evening: [1020, 1200] };

function dist(a, b) { const A = PLACES[a], B = PLACES[b]; return Math.abs(A.x - B.x) + Math.abs(A.y - B.y); }
function miles(a, b) { return dist(a, b) * 0.025; }
function travel(a, b, mode) {
  if (!a || !b || a === b) return 0;
  const m = MODES[mode];
  return Math.max(2, Math.round(m.fixed + dist(a, b) * m.perUnit));
}

function fmt(min) {
  min = Math.round(min);
  let h = Math.floor(min / 60), m = min % 60;
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, '0')} ${ap}`;
}
function fmtShort(min) { return fmt(min).replace(':00', ''); }
function dur(min) {
  min = Math.round(min);
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h} h ${m} min` : `${h} h`;
}

function inPeak(t, peak) { const p = PEAKS[peak]; return t >= p[0] && t < p[1]; }

/**
 * Schedule one day.
 * opts: { tasks, fixed, settings, startTime, startPlace, order: 'smart'|'input' }
 * Returns { steps, unscheduled, stats }
 */
function schedule(opts) {
  const { tasks, fixed, settings } = opts;
  const mode = settings.mode, buffer = settings.buffer;
  const order = opts.order || 'smart';
  let t = opts.startTime, loc = opts.startPlace;
  const steps = [];
  const remaining = tasks.filter(x => !x.done);
  const fixedQ = fixed.filter(f => f.end > t).sort((a, b) => a.start - b.start);
  let focusRun = 0, needBreak = false, lastTaskPlace = null, lastArea = null;

  const pushTravel = (to, why) => {
    const tr = travel(loc, to, mode);
    if (tr > 0) {
      steps.push({ type: 'travel', from: loc, to, start: t, end: t + tr + buffer, minutes: tr, buffer, mode, miles: miles(loc, to), why });
      t += tr + buffer;
      if (tr >= 8) { focusRun = 0; needBreak = false; }
    }
    loc = to;
  };

  for (let guard = 0; guard < 80; guard++) {
    const F = fixedQ[0];
    const cands = [];
    remaining.forEach((task, idx) => {
      const p = task.place || loc;
      const P = PLACES[p];
      let bt = t;
      const breakFirst = needBreak && travel(loc, p, mode) < 8;
      if (breakFirst) bt += settings.breakLen;
      const tr = travel(loc, p, mode);
      const arrive = bt + tr + (tr ? buffer : 0);
      const winStart = task.window ? task.window[0] : 0;
      const begin = Math.max(arrive, P.open, winStart);
      const wait = begin - arrive;
      const finish = begin + task.dur;
      if (finish > P.close) return;
      if (task.window && finish > task.window[1]) return;
      if (finish > settings.dayEnd) return;
      if (F) {
        const trF = travel(p, F.place, mode);
        if (finish + trF + (trF ? buffer : 0) > F.start) return;
      }
      if (wait > 45) return; // don't idle long when something else could happen
      let score;
      if (order === 'input') score = tasks.indexOf(task);
      else if (Array.isArray(order)) score = order.indexOf(task.id);
      else {
        score = tr * 1.0 + wait * 1.3;
        if (task.deadline != null) {
          const slack = task.deadline - finish;
          score -= slack < 0 ? -200 : Math.max(0, 150 - slack) * 0.35;
        }
        if (P.close < 1440) score -= Math.max(0, 210 - (P.close - finish)) * 0.22;
        if (task.window) score -= Math.max(0, 180 - (task.window[1] - finish)) * 0.15;
        const peak = inPeak(begin, settings.peak);
        if (task.energy === 'high') score += peak ? -28 : 22;
        if (task.energy === 'low') score += peak ? 10 : -4;
        score -= (task.priority - 1) * 5;
        // prefer finishing an area before leaving it
        if (task.place && lastArea && PLACES[task.place].area === lastArea) score -= 6;
      }
      cands.push({ task, idx, p, tr, begin, wait, finish, breakFirst, score });
    });

    if (!cands.length) {
      if (F) {
        if (needBreak && travel(loc, F.place, mode) < 8 && t + settings.breakLen + travel(loc, F.place, mode) + buffer <= F.start) {
          steps.push({ type: 'break', start: t, end: t + settings.breakLen });
          t += settings.breakLen; needBreak = false; focusRun = 0;
        }
        const trF = travel(loc, F.place, mode);
        const leave = Math.max(t, F.start - trF - (trF ? buffer : 0));
        if (leave > t) { steps.push({ type: 'free', start: t, end: leave }); t = leave; }
        pushTravel(F.place, `Gets you to ${F.title.toLowerCase()} on time`);
        steps.push({ type: 'fixed', event: F, place: F.place, start: F.start, end: F.end });
        t = Math.max(t, F.end);
        lastArea = PLACES[F.place].area;
        lastTaskPlace = F.place;
        fixedQ.shift();
        focusRun = 0;
        continue;
      }
      break;
    }

    cands.sort((a, b) => a.score - b.score);
    const c = cands[0];
    if (c.breakFirst) {
      steps.push({ type: 'break', start: t, end: t + settings.breakLen });
      t += settings.breakLen; needBreak = false; focusRun = 0;
    }
    const prevLoc = loc, prevArea = lastArea;
    if (c.task.place && c.task.place !== loc) pushTravel(c.task.place);
    if (c.begin > t) { steps.push({ type: 'free', start: t, end: c.begin }); t = c.begin; }

    // reasons
    const P = PLACES[c.p];
    const reasons = [];
    const peak = inPeak(c.begin, settings.peak);
    if (c.task.energy === 'high' && peak) reasons.push(`Deep work in your ${settings.peak} focus peak.`);
    if (c.task.deadline != null) {
      const slack = c.task.deadline - c.finish;
      reasons.push(slack >= 0 ? `Due ${fmtShort(c.task.deadline)}; done with ${dur(slack)} to spare.` : `Due ${fmtShort(c.task.deadline)}; this is the earliest open slot.`);
    }
    if (c.task.place && P.close < 1440 && P.close - c.finish < 240) reasons.push(`${P.name} closes at ${fmtShort(P.close)}.`);
    if (c.task.window && !reasons.length) reasons.push(`Fits your ${fmtShort(c.task.window[0])} to ${fmtShort(c.task.window[1])} window.`);
    if (c.task.place && c.task.place === prevLoc) reasons.push('Same place as your last stop, no travel.');
    else if (c.task.place && c.tr && c.tr <= 8 && lastTaskPlace) reasons.push(`${c.tr} min from ${PLACES[prevLoc].name}.`);
    if (c.task.place && prevArea && P.area === prevArea && c.task.place !== prevLoc) reasons.push(`Grouped with your other ${P.area} stops.`);
    if (!c.task.place) {
      if (F && F.start - c.finish < 40) reasons.push(`No location needed; fills the gap before ${F.title.toLowerCase()}.`);
      else reasons.push(`No location needed; done at ${PLACES[c.p].name}.`);
    }
    if (c.task.energy === 'low' && !peak && reasons.length < 2) reasons.push('Light task, kept out of your focus peak.');
    if (c.task.energy === 'med' && reasons.length < 2) reasons.push(peak ? 'Moderate effort while your energy is up.' : 'Moderate effort, after your deep work is done.');
    if (c.task.place && prevArea && P.area !== prevArea && reasons.length < 2) reasons.push(`Starts your ${P.area} stops.`);
    if (c.task.place && !prevArea && reasons.length < 2) reasons.push('First errand, on your way out.');
    if (!reasons.length) reasons.push('Shortest detour from where you are.');

    steps.push({ type: 'task', task: c.task, place: c.p, start: c.begin, end: c.finish, reasons: reasons.slice(0, 2) });
    t = c.finish;
    if (c.task.place) { lastTaskPlace = c.task.place; lastArea = P.area; }
    remaining.splice(remaining.indexOf(c.task), 1);
    focusRun += c.task.dur;
    if (focusRun >= settings.breakEvery) needBreak = true;
  }

  // remaining fixed events
  while (fixedQ.length) {
    const F = fixedQ.shift();
    const trF = travel(loc, F.place, mode);
    const leave = Math.max(t, F.start - trF - (trF ? buffer : 0));
    if (leave > t) { steps.push({ type: 'free', start: t, end: leave }); t = leave; }
    pushTravel(F.place, `Gets you to ${F.title.toLowerCase()} on time`);
    steps.push({ type: 'fixed', event: F, place: F.place, start: F.start, end: F.end });
    t = Math.max(t, F.end);
  }
  if (loc !== settings.home) pushTravel(settings.home, 'Back home');
  const finishAt = t;

  const travelMin = steps.filter(s => s.type === 'travel').reduce((a, s) => a + s.minutes, 0);
  const waitMin = steps.filter(s => s.type === 'free').reduce((a, s) => a + (s.end - s.start), 0);
  const unscheduled = remaining.map(task => {
    const P = PLACES[task.place || settings.home];
    let why = 'No open slot long enough today.';
    if (task.place && P.close < 1440) why = `${P.name} closes at ${fmtShort(P.close)} and the day is full before then.`;
    if (task.deadline != null) why = `Couldn't fit before its ${fmtShort(task.deadline)} deadline.`;
    return { task, why };
  });
  return { steps, unscheduled, stats: { finishAt, travelMin, waitMin, stops: new Set(steps.filter(s => s.type === 'task' && s.task.place).map(s => s.place)).size } };
}

// Objective: lower is better.
function cost(r, settings) {
  let c = r.stats.finishAt + r.stats.travelMin * 0.9 + r.stats.waitMin * 0.35 + r.unscheduled.length * 600;
  r.steps.forEach(s => {
    if (s.type !== 'task') return;
    const pk = inPeak(s.start, settings.peak);
    if (s.task.energy === 'high' && !pk) c += 45;
    if (s.task.energy === 'low' && pk) c += 8;
    if (s.task.deadline != null && s.end > s.task.deadline) c += (s.end - s.task.deadline) * 4 + 120;
    c -= (s.task.priority - 1) * 0; // priority only matters when something must drop
  });
  r.unscheduled.forEach(u => { c += (u.task.priority) * 150; });
  return c;
}

// Seeded RNG so the same inputs always give the same plan.
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }

/** Search task orderings; returns the best schedule plus the input-order baseline. */
function optimize(opts) {
  const active = opts.tasks.filter(t => !t.done);
  const ids = active.map(t => t.id);
  const run = order => schedule({ ...opts, order });
  const evalOrder = order => { const r = run(order); return { r, c: cost(r, opts.settings), order }; };

  const baseline = run('input');
  const greedy = run('smart');
  const greedyOrder = greedy.steps.filter(s => s.type === 'task').map(s => s.task.id);
  ids.forEach(id => { if (!greedyOrder.includes(id)) greedyOrder.push(id); });

  let best = evalOrder(greedyOrder);
  const inp = evalOrder(ids.slice());
  if (inp.c < best.c) best = inp;

  const rand = rng(ids.length * 7919 + Math.round(opts.startTime) + opts.settings.mode.length * 31);
  const localSearch = start => {
    let cur = start, improved = true;
    while (improved) {
      improved = false;
      for (let i = 0; i < ids.length && !improved; i++) {
        for (let j = 0; j < ids.length && !improved; j++) {
          if (i === j) continue;
          const o = cur.order.slice();
          const [x] = o.splice(i, 1); o.splice(j, 0, x);
          const e = evalOrder(o);
          if (e.c < cur.c - 0.01) { cur = e; improved = true; }
        }
      }
    }
    return cur;
  };
  best = localSearch(best);
  for (let k = 0; k < 24; k++) {
    const o = ids.slice();
    for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    const e = localSearch(evalOrder(o));
    if (e.c < best.c) best = e;
  }
  return { ...best.r, baseline, cost: best.c };
}

// Saving: instantly to this browser, and (when signed in) to the person's private account storage.
const STORE = { db: null, ref: null, mode: 'local', pending: null, writing: false, lastRev: null };
function save() {
  S.updatedAt = Date.now();
  const snap = snapshotState();
  try { localStorage.setItem(KEY, JSON.stringify(snap)); } catch (e) { /* storage unavailable */ }
  if (!STORE.ref) return;
  STORE.pending = snap;
  clearTimeout(save._t); save._t = setTimeout(flushRemote, 600);
}
async function flushRemote() {
  if (STORE.writing || !STORE.pending || !STORE.ref) return;
  const body = STORE.pending; STORE.pending = null; STORE.writing = true;
  body.rev = STORE.lastRev = Math.random().toString(36).slice(2);
  try { await STORE.ref.set(body); setStoreMode('cloud'); }
  catch (e) {
    if (e && e.code === 'unavailable') { STORE.pending = STORE.pending || body; setTimeout(flushRemote, 1500 + Math.random() * 1500); }
    else if (e && e.code === 'quota_exceeded') toast('Your account storage is full. Clear old history to keep saving.');
    else { STORE.ref = null; setStoreMode('local'); }
  } finally { STORE.writing = false; if (STORE.pending) flushRemote(); }
}
function setStoreMode(m) { if (STORE.mode === m) return; STORE.mode = m; if ($('#railFoot')) renderRailFoot(); }
function adoptRemote(data) {
  const keepUI = S.clock;
  S = normalize(data); S.clock = keepUI; applyPlaces();
  try { localStorage.setItem(KEY, JSON.stringify(snapshotState())); } catch (e) { /* ignore */ }

}
async function connectStore() {
  const api = window.claude && window.claude.use;
  if (!api) return;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  const id = user ? await user.id() : null;
  if (!db || !id) { setStoreMode('local'); return; }
  STORE.db = db;
  const ref = db.collection('data/users/' + id).doc('state');
  let first = true, timer = setTimeout(() => { if (first) setStoreMode('offline'); }, 10000);
  ref.onSnapshot(snap => {
    if (snap.metadata.fromCache && first) return;
    clearTimeout(timer);
    const data = snap.exists ? snap.data() : null;
    if (first) {
      first = false; STORE.ref = ref; setStoreMode('cloud');
      if (data && (data.updatedAt || 0) >= (S.updatedAt || 0)) adoptRemote(data);
      else save(); // first visit on this account, or this browser has newer changes: upload them
      return;
    }
    if (!data || snap.metadata.hasPendingWrites || data.rev === STORE.lastRev) return;
    if ((data.updatedAt || 0) > (S.updatedAt || 0)) adoptRemote(data); // edited on another device
  }, () => { clearTimeout(timer); STORE.ref = null; setStoreMode('local'); });
}

// A new day: archive yesterday, carry unfinished tasks forward.
function rollDay() {
  const today = todayKey();
  if (S.day >= today) return false;
  const p = (() => { try { return computePlan(); } catch (e) { return null; } })();
  const done = S.tasks.filter(t => S.checked[t.id]);
  S.history = [{ day: S.day, done: done.length, total: S.tasks.length, travelMin: p ? planStats(p).travelMin : 0 }].concat(S.history || []).slice(0, 60);
  S.tasks = S.tasks.filter(t => !S.checked[t.id]).map(t => { const c = { ...t }; delete c.pinned; return c; }).concat((S.later || []).filter(l => !l.for || l.for <= today).map(l => l.task));
  S.later = (S.later || []).filter(l => l.for && l.for > today);
  S.fixed = [];
  S.day = today; S.base = null; S.checked = {}; S.synced = false; S.gcal = { ids: [], day: null };
  save();
  return true;
}

// ---------- planning ----------
function buildInputs(extra = {}) {
  const st = { ...S.settings, ...(extra.settings || {}) };
  const tasks = (extra.tasks || S.tasks);
  const fixed = (extra.fixed || S.fixed).slice();
  const free = [];
  tasks.forEach(t => {
    if (t.pinned) fixed.push({ id: t.id, title: t.title, start: t.pinned.start, end: t.pinned.end, place: t.pinned.place, source: 'Locked by you', fromTask: t });
    else free.push(t);
  });
  return { st, free, fixed };
}

function computePlan(extra = {}) {
  const { st, free, fixed } = buildInputs(extra);
  const base = extra.base !== undefined ? extra.base : S.base;
  const startPlace = st.startAt === 'work' ? 'work' : st.home;
  let startTime = st.dayStart, loc = startPlace, kept = [], doneIds = new Set();
  // planning today: start from the next five minutes, never in the past
  if (!base && S.day === todayKey()) startTime = Math.max(st.dayStart, Math.min(Math.ceil((nowMin() + 1) / 5) * 5, st.dayEnd - 15));
  if (base) {
    startTime = base.time; loc = base.loc; kept = base.kept;
    doneIds = new Set(base.doneIds);
  }
  const remaining = free.filter(t => !doneIds.has(t.id));
  const fx = fixed.filter(f => !doneIds.has(f.id) && f.end > startTime);
  const r = optimize({ tasks: remaining, fixed: fx, settings: st, startTime, startPlace: loc });
  // "doing it in the order you wrote it", from the same starting point
  return { ...r, steps: kept.concat(r.steps), keptCount: kept.length, baseTime: base ? base.time : null, settings: st };
}

function planStats(p) {
  const travelMin = p.steps.filter(s => s.type === 'travel').reduce((a, s) => a + s.minutes, 0);
  const waitMin = p.steps.filter(s => s.type === 'free').reduce((a, s) => a + (s.end - s.start), 0);
  const bl = p.baseline.stats;
  const saved = Math.max(0, (bl.travelMin + bl.waitMin) - (p.stats.travelMin + p.stats.waitMin));
  const earlier = Math.max(0, bl.finishAt - p.stats.finishAt);
  return { travelMin, waitMin, saved, earlier, finishAt: p.stats.finishAt };
}

function diffPlans(a, b) {
  const pos = p => { const m = {}; p.steps.forEach(s => { if (s.type === 'task') m[s.task.id] = s.start; if (s.type === 'fixed' && s.event.fromTask) m[s.event.fromTask.id] = s.start; }); return m; };
  const A = pos(a), B = pos(b), out = { moved: [], added: [], dropped: [], map: {} };
  Object.keys(B).forEach(id => {
    if (A[id] == null) { out.added.push(id); out.map[id] = 'New'; }
    else { const d = B[id] - A[id]; if (Math.abs(d) >= 5) { out.moved.push({ id, d }); out.map[id] = d < 0 ? `${dur(-d)} earlier` : `${dur(d)} later`; } }
  });
  Object.keys(A).forEach(id => { if (B[id] == null) out.dropped.push(id); });
  return out;
}

function withFlip(fn) {
  const before = {};

  fn();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('[data-flip]').forEach(el => {
    const a = before[el.dataset.flip];
    if (!a) { el.animate([{ opacity: 0.001, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.16,1,.3,1)' }); return; }
    const b = el.getBoundingClientRect(), dy = a.top - b.top;
    if (Math.abs(dy) < 1) return;
    el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 560, easing: 'cubic-bezier(.16,1,.3,1)' });
  });
}

// ================= PARSER =================
const PLACE_WORDS = [[/pharmac|prescription|\bmeds\b/i, 'pharmacy'], [/post office|\bmail\b|package|\bship\b/i, 'post'], [/grocer|groceries|market/i, 'market'], [/dry clean|cleaners/i, 'cleaner'], [/\bgym\b|workout|\blift/i, 'gym'], [/librar/i, 'library'], [/birthday card|\bcard\b|stationer|paperleaf/i, 'paper'], [/marisol/i, 'friend'], [/dentist|dental/i, 'dentist'], [/caf[eé]|coffee/i, 'cafe'], [/\boffice\b|cowork/i, 'work']];
const NUMW = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, fifteen: 15, twenty: 20, thirty: 30, forty: 40, ninety: 90 };

    line.split(new RegExp(`,?\\s+and\\s+(?:then\\s+)?(?=(?:i\\s+(?:need\\s+to|should|have\\s+to|want\\s+to|gotta)\\s+)?${VERBS}\\b)|,\\s*(?=(?:and\\s+)?(?:i\\s+(?:need\\s+to|should|have\\s+to|want\\s+to|gotta)\\s+)?${VERBS}\\b)`, 'i')).forEach(p => { const q = (p || '').trim(); if (q.length > 2 && !/^(okay|ok|um|so|well|alright)[,.!]*$/i.test(q)) out.push(q); });

function parseLine(raw) {

  s = s.replace(/\b(forty-five)\b/gi, '45').replace(new RegExp(`\\b(${Object.keys(NUMW).join('|')})\\b`, 'gi'), m => NUMW[m.toLowerCase()]);

  else if ((m = s.match(/\b(?:for\s+)?half an hour\b/i))) { tok.dur = 30; s = s.replace(m[0], ' '); }
  else if ((m = s.match(/\b(?:for\s+)?an hour\b/i))) { tok.dur = 60; s = s.replace(m[0], ' '); }
  if ((m = s.match(/\b(before|by)\s+(\d{1,2})(?::(\d\d))?\s*(am|pm)?\b/i))) {

    tok.deadline = h * 60 + mm; s = s.replace(m[0], ' ');
  }

  else if ((m = s.match(/\bthis morning\b/i))) { tok.window = [480, 720]; s = s.replace(m[0], ' '); }
  const remote = /^\s*(?:and\s+)?(?:i\s+(?:need\s+to|should|have\s+to|want\s+to|gotta)\s+)?(?:call|text|email|phone|message)\b/i.test(s);

  const prompt = `You turn a person's messy to-do notes into tasks for a day planner. The day being planned is ${longDate(S.day)}.
Known places (key: name):
${places}

<notes>
${text.slice(0, 6000)}
</notes>

Reply with only a JSON array. One object per distinct task, in this shape:
{"title": "Pick up prescription", "dur": 15, "place": "pharmacy", "deadline": "17:00", "window": null, "energy": "low", "priority": 2}
Rules: title is short and starts with a verb, with no times or durations in it. dur is minutes (estimate if not given). place is one of the keys above, or null when the task can be done anywhere (calls, emails, online). deadline is "HH:MM" 24-hour or null. window is ["HH:MM","HH:MM"] when the note limits when it can happen (tonight = ["18:00","21:00"]) or null. energy is "high" for focused work, "low" for errands and quick admin, otherwise "med". priority is 3 urgent, 2 normal, 1 can wait. Skip filler that is not a task.`;
  const arr = await sm.json(prompt, { modelTier: 'quick' }).catch(e => {
    if (e && e.code === 'not_granted') { AI.ok = false; throw new Error('AI reading wasn’t allowed. The quick reader still works.'); }
    if (e && e.code === 'rate_limited') throw new Error('AI is busy. Try again in a moment.');
    throw new Error('AI couldn’t read that. The quick reader’s result is kept.');
  });
  if (!Array.isArray(arr)) return null;
  const toMin = v => (typeof v === 'string' && /^\d{1,2}:\d{2}$/.test(v)) ? hm(v) : null;
  return arr.filter(x => x && typeof x.title === 'string' && x.title.trim()).slice(0, 40).map(x => {
    const d = Math.min(480, Math.max(5, Math.round(+x.dur || 30)));
    const w = Array.isArray(x.window) && toMin(x.window[0]) != null && toMin(x.window[1]) > toMin(x.window[0]) ? [toMin(x.window[0]), toMin(x.window[1])] : null;
    return { id: nid('p'), title: x.title.trim().slice(0, 120), dur: d, place: PLACES[x.place] && x.place !== 'home' ? x.place : null, deadline: toMin(x.deadline), window: w, energy: ['high', 'med', 'low'].includes(x.energy) ? x.energy : 'med', priority: [1, 2, 3].includes(+x.priority) ? +x.priority : 2 };
  });
}

// ---- Google Calendar (the viewer's own connector, through the page's mcp capability) ----
const GSERVER = 'Google Calendar';
const GCAL = { busy: false, last: null, pulledFor: null };
const MARK = '#mindless';
async function mcpApi() {
  const m = window.claude && window.claude.use ? await window.claude.use('mcp') : null;
  if (!m) throw { code: 'unavailable_here' };
  return m;
}
function gErr(e) {
  const c = e && e.code;
  if (c === 'unavailable_here') return 'Calendar access works when Mindless is open on claude.ai and you’re signed in.';
  if (c === 'server_not_connected' || c === 'server_not_found') return 'Connect Google Calendar in Claude (Settings, Connectors), then try again.';
  if (c === 'needs_reauth') return 'Google Calendar needs you to sign in again in your Claude connector settings.';
  if (c === 'consent_required' || c === 'not_granted' || c === 'approval_required' || c === 'blocked_by_policy' || c === 'self_only') return 'Mindless needs your OK to use Google Calendar. Try again and allow it.';
  if (c === 'rate_limited') return 'Google Calendar is busy. Try again in a minute.';
  return 'Google Calendar didn’t respond. Try again in a moment.';
}
const localISO = (day, min) => `${day}T${toHM(Math.max(0, Math.min(1439, Math.round(min))))}:00`;
async function gcalConnect() {
  S.settings.calendars.google = true; save();
  const ok = await gcalPull(true);
  if (!ok) { S.settings.calendars.google = false; save(); }
  route();
}
function gcalDisconnect() {
  S.settings.calendars.google = false;
  S.fixed = S.fixed.filter(f => !f.gid); S.synced = false; S.base = null;
  save(); refreshPlan(); route(); toast('Google Calendar disconnected. Blocks already added stay on your calendar.');
}
async function gcalPull(manual) {
  if (GCAL.busy) return false;
  GCAL.busy = true; if (manual && U.view) route();
  try {
    const m = await mcpApi();
    const r = await m.callTool(GSERVER, 'list_events', { startTime: localISO(S.day, 0), endTime: `${nextDayKey(S.day)}T00:00:00`, orderBy: 'startTime', pageSize: 100 });
    const pl = r && r.payload, evs = (pl && Array.isArray(pl.events)) ? pl.events : [];
    const own = new Set(S.gcal.ids || []);
    const mapped = [];
    evs.forEach(ev => {
      if (!ev || ev.status === 'cancelled' || own.has(ev.id) || !ev.start || !ev.start.dateTime || !ev.end) return;
      if ((ev.description || '').includes(MARK)) return;
      if ((ev.attendees || []).some(a => a.self && a.responseStatus === 'declined')) return;
      const a = new Date(ev.start.dateTime), b = new Date(ev.end.dateTime || ev.start.dateTime);
      const start = dayKey(a) === S.day ? a.getHours() * 60 + a.getMinutes() : 0;
      const end = dayKey(b) === S.day ? b.getHours() * 60 + b.getMinutes() : 1440;
      if (end <= start) return;
      const place = S.placeFor[ev.id] || guessPlace((ev.summary || '') + ' ' + (ev.location || '')) || S.settings.home;
      mapped.push({ id: 'g' + String(ev.id).replace(/[^a-zA-Z0-9]/g, '').slice(-24), gid: ev.id, title: ev.summary || 'Busy', start, end, place, source: 'Google Calendar' });
    });
    const sig = arr => JSON.stringify(arr.map(f => [f.gid, f.start, f.end, f.title]));
    const changed = sig(S.fixed.filter(f => f.gid)) !== sig(mapped);
    S.fixed = S.fixed.filter(f => !f.gid).concat(mapped);
    GCAL.last = nowMin(); GCAL.pulledFor = S.day;
    if (changed) { save(); refreshPlan(); }
    if (manual) toast(mapped.length ? `${mapped.length} ${mapped.length === 1 ? 'event' : 'events'} from Google Calendar for ${dayWord()}` : `No timed events on Google Calendar for ${dayWord()}`);
    return true;
  } catch (e) {
    if (manual) toast(gErr(e));
    return false;
  } finally { GCAL.busy = false; if (U.view) route(); }
}
async function gcalPush() {
  if (GCAL.busy || !U.plan) return;
  GCAL.busy = true; route();
  let made = 0;
  try {
    const m = await mcpApi();
    for (const id of (S.gcal.ids || [])) {
      try { await m.callTool(GSERVER, 'delete_event', { eventId: id, notificationLevel: 'NONE' }); }
      catch (e) { if (e && e.code !== 'tool_error') throw e; }
    }
    S.gcal.ids = []; save();
    const steps = U.plan.steps.filter(x => (x.type === 'task' || x.type === 'travel') && !(isToday() && x.end <= S.clock) && !S.checked[x.type === 'task' ? x.task.id : '']);
    for (const x of steps) {
      const summary = x.type === 'task' ? x.task.title : `${MODES[x.mode].label} to ${PLACES[x.to].name}`;
      const where = x.type === 'task' ? (x.task.place ? PLACES[x.place] : null) : PLACES[x.to];
      const why = x.type === 'task' && x.reasons && x.reasons.length ? x.reasons.join(' ') + '\n\n' : '';
      const input = { summary, startTime: localISO(S.day, x.start), endTime: localISO(S.day, x.end), description: `${why}Planned by Mindless ${MARK}` };
      if (where && where.addr) input.location = where.addr;
      const r = await m.callTool(GSERVER, 'create_event', input);
      const ev = r && r.payload; if (ev && ev.id) { S.gcal.ids.push(ev.id); made++; }
    }
    S.gcal.day = S.day; S.synced = true; save();
    toast(`${made} ${made === 1 ? 'block' : 'blocks'} on your Google Calendar`);
  } catch (e) { toast(gErr(e)); }
  finally { GCAL.busy = false; route(); }
}
function resyncIfSynced() {
  if (S.synced && S.settings.calendars.google && S.settings.syncMode === 'two-way') gcalPush();
}

function daySwitch() {
  const t = todayKey(), tm = tomorrowKey();
  return `<div class="seg day-seg" role="group" aria-label="Day to plan"><button type="button" data-day="${t}" aria-pressed="${S.day === t}">Today</button><button type="button" data-day="${tm}" aria-pressed="${S.day === tm}">Tomorrow</button></div>`;
}
function bindDaySwitch() {
  $$('[data-day]').forEach(b => b.onclick = () => {
    const k = b.dataset.day; if (k === S.day) return;
    if (S.day === todayKey() && k === tomorrowKey()) {
      const done = S.tasks.filter(t => S.checked[t.id]);
      if (done.length) S.history = [{ day: S.day, done: done.length, total: S.tasks.length, travelMin: U.plan ? planStats(U.plan).travelMin : 0 }].concat(S.history).slice(0, 60);
      S.tasks = S.tasks.filter(t => !S.checked[t.id]);
    }

    S.day = k; S.fixed = []; S.base = null; S.checked = {}; S.synced = false; S.gcal = { ids: [], day: null }; U.diff = null; U.undo = null;
    save(); refreshPlan(); route();
    if (S.settings.calendars.google) gcalPull(false);
  });
}

  });

  $$('[data-delt]').forEach(b => b.onclick = () => { S.tasks = S.tasks.filter(t => t.id !== b.dataset.delt); S.synced = false; S.base = null; U.diff = null; save(); refreshPlan(); route(); });
  $$('[data-delf]').forEach(b => b.onclick = () => { S.fixed = S.fixed.filter(f => f.id !== b.dataset.delf); S.synced = false; S.base = null; U.diff = null; save(); refreshPlan(); route(); });
  const bb = $('#buildBtn'); bb.onclick = e => {

// ================= PLAN =================
function placeLabel(k) { return k ? PLACES[k].name : 'Anywhere'; }
function greeting() {
  const c = S.clock, n = (S.settings.name || '').trim();
  const g = c < 720 ? 'Good morning' : c < 1020 ? 'Good afternoon' : 'Good evening';
  return n ? `${g}, ${esc(n)}` : g;
}
function headline(p, ps) {
  return `Everything’s done by <span class="tnum">${fmt(ps.finishAt)}</span><span class="soft">${p.unscheduled.length ? `, with ${p.unscheduled.length} left for tomorrow.` : '.'}</span>`;
}
function rationale(p) {
  const st = p.settings, bits = [];
  const tasks = p.steps.filter(s => s.type === 'task');
  const deep = tasks.filter(s => s.task.energy === 'high');
  if (deep.length) {
    const inPk = deep.every(s => s.start >= PEAKS[st.peak][0] && s.start < PEAKS[st.peak][1]);
    bits.push(inPk ? `deep work lands in your ${st.peak} peak` : `deep work takes the longest open block before its deadline`);
  }
  const areas = []; tasks.forEach(s => { if (s.task.place) { const a = PLACES[s.task.place].area; if (areas[areas.length - 1] !== a) areas.push(a); } });
  const uniq = [...new Set(areas)];
  if (uniq.length > 1) bits.push(`errands are grouped by neighborhood`);
  const closing = tasks.filter(s => s.task.place && PLACES[s.task.place].close < 1440 && PLACES[s.task.place].close - s.end < 120);
  if (closing.length) bits.push(`${PLACES[closing[0].task.place].name} is reached before it closes`);
  if (!bits.length) return 'Tasks are ordered to keep travel short and fit around your calendar.';
  const s = bits.length > 1 ? bits.slice(0, -1).join(', ') + ' and ' + bits[bits.length - 1] : bits[0];
  return s.charAt(0).toUpperCase() + s.slice(1) + '.';
}
const stepId = s => s.type === 'task' ? s.task.id : s.event.fromTask ? s.event.fromTask.id : s.event.id;
const stepTitle = s => s.type === 'task' ? s.task.title : s.event.title;
function isStepDone(p, s, i) { return (p.baseTime != null && i < p.keptCount) || !!S.checked[stepId(s)]; }

function nowNext(p) {
  const c = S.clock, steps = p.steps;
  if (!isToday()) {
    const first = steps.find(s => s.type === 'task' || s.type === 'fixed');
    return `<section class="nownext" aria-label="Day ahead"><div class="nn-now"><div class="nn-k">Planned for ${esc(dayWord())}</div><div class="nn-t">${first ? esc(stepTitle(first)) : 'Nothing yet'}</div><div class="nn-s">${first ? `First up at ${fmt(first.start)}, at ${esc(PLACES[first.place].name)}.` : ''}</div></div><div class="nn-next"><div class="nn-k">Check-offs</div><div class="nn-t2 muted">Open on ${esc(longDate(S.day))} to tick things off as you go.</div></div></section>`;
  }
  const cur = steps.find(s => s.start <= c && c < s.end && s.type !== 'free');
  const real = steps.map((s, i) => ({ s, i })).filter(x => (x.s.type === 'task' || x.s.type === 'fixed') && x.s.start >= c && x.s !== cur && !S.checked[stepId(x.s)]);
  const nx = real[0];
  let nowT, nowS, nowAct = '';
  if (!cur) {
    if (c < steps[0].start) { nowT = 'Your day hasn’t started'; nowS = `First up at ${fmt(steps[0].start)}.`; }
    else if (!nx) { nowT = 'All done for today'; nowS = 'Nothing else is planned. Enjoy the evening.'; }
    else { nowT = 'Free time'; nowS = `Nothing scheduled until ${fmt(nx.s.start)}.`; }
  } else if (cur.type === 'travel') { nowT = `Heading to ${PLACES[cur.to].name}`; nowS = `${MODES[cur.mode].label}, arrive about ${fmt(cur.end)}.`; }
  else if (cur.type === 'break') { nowT = 'Taking a break'; nowS = `Back to it at ${fmt(cur.end)}.`; }
  else {
    nowT = stepTitle(cur); nowS = `Until ${fmt(cur.end)}, at ${esc(PLACES[cur.place].name)}.`;
    const id = stepId(cur);
    if (cur.type === 'task') nowAct = S.checked[id] ? `<span class="chip acc">${icon('check')}Done</span>` : `<button class="btn sm" data-check="${id}">${icon('check')}Mark done</button>`;
  }
  let next = `<div class="nn-t2 muted">Nothing after this</div>`;
  if (nx) {
    const prev = steps[nx.i - 1];
    const leave = prev && prev.type === 'travel' && prev.start > c ? `, leave by ${fmt(prev.start)}` : '';
    next = `<div class="nn-t2">${esc(stepTitle(nx.s))}</div><div class="nn-s tnum">${fmt(nx.s.start)} at ${esc(PLACES[nx.s.place].name)}${leave}</div>`;
  }
  return `<section class="nownext" aria-label="Now and next">
    <div class="nn-now"><div class="nn-k"><span class="pulse" aria-hidden="true"></span>Now, <span class="tnum">${fmt(c)}</span></div><div class="nn-t">${esc(nowT)}</div><div class="nn-s">${nowS}</div>${nowAct ? `<div style="margin-top:10px">${nowAct}</div>` : ''}</div>
    <div class="nn-next"><div class="nn-k">Next</div>${next}</div>
  </section>`;
}

function renderSteps(p) {
  const c = isToday() ? S.clock : -1;
  const out = [];
  let nowPlaced = false;
  const nowLi = `<li class="now-li" aria-label="Now, ${fmt(c)}"><div class="time tnum">${fmtShort(c)}</div><div class="now-dot" aria-hidden="true"></div><div class="now-line"><span>Now</span></div></li>`;
  p.steps.forEach((s, i) => {
    if (c >= 0 && !nowPlaced && s.start >= c && i > 0) { out.push(nowLi); nowPlaced = true; }
    if (!nowPlaced && s.start < c && c < s.end && s.type !== 'travel' && s.type !== 'free') { /* now line goes after the current step */ }
    if (s.type === 'travel') { out.push(`<li class="leg"><div class="time tnum">${fmtShort(s.start)}</div><div class="node"></div><div class="body">${icon(s.mode)}<b>${MODES[s.mode].label} ${s.minutes} min</b><span>to ${esc(PLACES[s.to].name)}, ${s.miles.toFixed(1)} mi${s.buffer ? `, plus ${s.buffer} min buffer` : ''}</span></div></li>`); return; }
    if (s.type === 'break') { out.push(`<li class="leg brk"><div class="time tnum">${fmtShort(s.start)}</div><div class="node"></div><div class="body">${icon('leaf')}<b style="color:inherit">Break, ${dur(s.end - s.start)}</b><span class="muted">Stretch, refill your water.</span></div></li>`); return; }
    if (s.type === 'free') { if (s.end - s.start >= 3) out.push(`<li class="leg"><div class="time tnum">${fmtShort(s.start)}</div><div class="node"></div><div class="body">${icon('pause')}<span>Open time, ${dur(s.end - s.start)}</span></div></li>`); return; }
    const id = stepId(s), done = isStepDone(p, s, i), kept = p.baseTime != null && i < p.keptCount;
    const live = s.start <= c && c < s.end;
    const tag = U.diff && U.diff.map[id] ? `<span class="chip acc">${U.diff.map[id]}</span>` : '';
    const sel = U.sel === s.place ? 'is-sel' : '';
    if (s.type === 'fixed') {
      const ft = s.event.fromTask;
      out.push(`<li class="${ft ? 'is-pinned' : 'is-fixed'} ${done ? 'is-done' : ''} ${live ? 'is-live' : ''} ${sel}" data-flip="${id}" data-place="${s.place}"><div class="time tnum">${fmt(s.start)}<small>${fmt(s.end)}</small></div><div class="node"></div><div class="body"><div class="step">
        ${ft ? `<button class="check" role="checkbox" aria-checked="${done}" data-check="${id}" ${kept ? 'disabled' : ''} aria-label="${esc(s.event.title)} done">${icon('check')}</button>` : `<span class="cal-ic" aria-hidden="true">${icon('calendar')}</span>`}
        <div class="grow"><div class="title">${esc(s.event.title)}</div><div class="where">${icon('pin')}${esc(PLACES[s.place].name)}<span>${icon(ft ? 'lock' : 'calendar')}${esc(s.event.source)}</span>${tag}</div></div>
        ${ft ? `<button class="icon-btn" data-pin="${ft.id}" aria-pressed="true" aria-label="Unlock ${esc(ft.title)} so Mindless can move it">${icon('lock')}</button>` : ''}</div></div></li>`);
      return;
    }
    const t = s.task, r = s.reasons || [];
    out.push(`<li class="${done ? 'is-done' : ''} ${live ? 'is-live' : ''} ${sel}" data-flip="${id}" data-place="${s.place}"><div class="time tnum">${fmt(s.start)}<small>${fmt(s.end)}</small></div><div class="node"></div><div class="body"><div class="step">
      <button class="check" role="checkbox" aria-checked="${done}" data-check="${id}" ${kept ? 'disabled' : ''} aria-label="${esc(t.title)} done">${icon('check')}</button>
      <div class="grow">
        <div class="title">${esc(t.title)}</div>
        <div class="where">${icon('pin')}${t.place ? esc(PLACES[t.place].name) : `Anywhere, at ${esc(PLACES[s.place].name)}`}<span class="tnum">${dur(t.dur)}</span>${tag}</div>
        ${done || !r.length ? '' : `<p class="hint">${esc(r[0])}${r.length > 1 ? ` <button type="button" class="why-btn" data-why aria-expanded="false" aria-controls="why-${id}">Why here?</button>` : ''}</p>${r.length > 1 ? `<p class="hint more" id="why-${id}" hidden>${r.slice(1).map(esc).join(' ')}</p>` : ''}`}
      </div>
      ${done ? '' : `<button class="icon-btn" data-pin="${t.id}" aria-pressed="false" aria-label="Lock ${esc(t.title)} at ${fmt(s.start)}" title="Lock this time">${icon('unlock')}</button>`}
    </div></div></li>`);
  });

  const banner = U.diff ? `<div class="banner" role="status">${icon('refresh')}<div class="grow"><b>${U.diffWhy ? esc(U.diffWhy) : `Re-planned at ${fmt(S.clock)}.`}</b> ${U.diff.moved.length} moved, ${U.diff.added.length} added${U.diff.dropped.length ? `, ${U.diff.dropped.length} moved to tomorrow` : ''}.${S.synced && st.syncMode === 'two-way' ? ' Your calendar was updated.' : ''}</div>${U.undo ? `<button class="btn sm" id="undo">${icon('undo')}Undo</button>` : ''}<button class="icon-btn" id="dismissBanner" aria-label="Dismiss">${icon('x')}</button></div>` : '';

}

    if (b.dataset.mode === S.settings.mode) return;
    const before = planStats(U.plan).finishAt, prevMode = S.settings.mode, old = U.plan;
    U.undo = { tasks: S.tasks, fixed: S.fixed, base: S.base, clock: S.clock, plan: old, diff: U.diff, why: U.diffWhy, mode: prevMode };
    S.settings.mode = b.dataset.mode; if (S.synced) S.synced = false; save();
    refreshPlan(); U.diff = diffPlans(old, U.plan); U.diffWhy = `Switched to ${MODES[S.settings.mode].label.toLowerCase()}.`;
    const after = planStats(U.plan).finishAt, d = after - before;
    U.drawRoute = true; route();
    const nb = $(`[data-mode="${S.settings.mode}"]`); nb && nb.focus();
    toast(d === 0 ? `${MODES[S.settings.mode].label}: same finish time` : `${MODES[S.settings.mode].label}: home ${dur(Math.abs(d))} ${d < 0 ? 'sooner' : 'later'}, at ${fmt(after)}`);
  });
  $('#clusterBtn').onclick = () => { S.settings.cluster = !S.settings.cluster; save(); route(); $('#clusterBtn').focus(); };
  $$('[data-replan]').forEach(b => b.onclick = openReplan);

  // draggable bottom sheet (phones)
  const sheet = $('#sheet'), handle = $('#sheetHandle'), grid = $('.map-grid');
  const mobile = () => matchMedia('(max-width: 820px)').matches;
  const setSnap = v => { U.sheet = v; sheet.style.setProperty('--sheet', v + '%'); if (U.mapApply) setTimeout(U.mapApply, 460); handle.setAttribute('aria-label', `Stop list ${v < 40 ? 'collapsed' : v < 70 ? 'half open' : 'expanded'}. Drag, or press to resize.`); };
  let startY = null, startH = 0, moved = false;
  handle.onpointerdown = e => { if (!mobile()) return; startY = e.clientY; startH = sheet.getBoundingClientRect().height; moved = false; handle.setPointerCapture(e.pointerId); sheet.classList.add('dragging'); };
  handle.onpointermove = e => {
    if (startY == null) return;
    const dy = startY - e.clientY; if (Math.abs(dy) > 4) moved = true;
    const H = grid.clientHeight, h = Math.min(H * 0.92, Math.max(H * 0.18, startH + dy));
    sheet.style.setProperty('--sheet', (h / H * 100) + '%');
  };
  const end = () => {
    if (startY == null) return;
    sheet.classList.remove('dragging');
    const H = grid.clientHeight, pct = sheet.getBoundingClientRect().height / H * 100; startY = null;
    if (!moved) { const i = SNAPS.findIndex(s => s > (U.sheet || 34) + 1); setSnap(SNAPS[i === -1 ? 0 : i]); }
    else setSnap(SNAPS.reduce((a, b) => Math.abs(b - pct) < Math.abs(a - pct) ? b : a));
  };
  handle.onpointerup = end; handle.onpointercancel = end;
  handle.onclick = e => { if (e.detail === 0) { const i = SNAPS.findIndex(s => s > (U.sheet || 34) + 1); setSnap(SNAPS[i === -1 ? 0 : i]); } };

  // ---- pan and zoom (Google Maps style) ----
  const svg = $('svg.map'), pane = $('.map-pane');
  const mobileNow = () => matchMedia('(max-width: 820px)').matches;
  const stopsEl = $$('svg.map .stop');
  const pts = [U.plan.settings.home, ...new Set(U.plan.steps.filter(s => (s.type === 'task' && s.task.place) || s.type === 'fixed').map(s => s.place))].map(k => PLACES[k]);
  const size = () => ({ W: Math.max(1, pane.clientWidth), H: Math.max(1, pane.clientHeight) });
  const pad = () => mobileNow() ? { t: 70, b: Math.round(grid.clientHeight * (U.sheet || 34) / 100) + 16, l: 18, r: 64 } : { t: 76, b: 104, l: 44, r: 140 };
  const MIN_W = 26, MAX_W = 190;
  const fit = () => {
    const { W, H } = size(), p = pad();
    const xs = pts.map(q => q.x), ys = pts.map(q => q.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const aw = Math.max(80, W - p.l - p.r), ah = Math.max(80, H - p.t - p.b);
    const u = Math.max((maxX - minX) / aw, (maxY - minY) / ah, MIN_W / W);
    return { x: (minX + maxX) / 2 - (p.l + aw / 2) * u, y: (minY + maxY) / 2 - (p.t + ah / 2) * u, w: W * u };
  };
  const clamp = v => {
    const { W, H } = size(); const w = Math.min(MAX_W, Math.max(MIN_W, v.w)), h = w * H / W;
    const cl = (val, len) => (170 - len < -60) ? 50 - len / 2 : Math.min(170 - len, Math.max(-60, val));
    return { x: cl(v.x, w), y: cl(v.y, h), w };
  };
  const apply = () => {
    const { W, H } = size(); const v = U.mapView = clamp(U.mapView); const u = v.w / W;
    svg.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.w * H / W}`);
    svg.style.setProperty('--u', u);
    stopsEl.forEach(g => { const X = +g.dataset.x, Y = +g.dataset.y, k = u * 5; g.setAttribute('transform', `translate(${X} ${Y}) scale(${k}) translate(${-X} ${-Y})`); });
    const zc = $('.map-zoom');
    if (zc) { if (mobileNow()) { const sh = grid.clientHeight * (U.sheet || 34) / 100; zc.style.top = 'auto'; zc.style.bottom = (sh + 12) + 'px'; zc.hidden = (U.sheet || 34) > 60; } else { zc.style.top = ''; zc.style.bottom = ''; zc.hidden = false; } }
    const zin = $('[data-zoom="in"]'), zout = $('[data-zoom="out"]');
    if (zin) zin.disabled = v.w <= MIN_W + 0.01; if (zout) zout.disabled = v.w >= MAX_W - 0.01;
  };
  const local = e => { const r = pane.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const zoomAt = (f, px, py, v = U.mapView) => { const { W } = size(); const u = v.w / W, wx = v.x + px * u, wy = v.y + py * u; const w = Math.min(MAX_W, Math.max(MIN_W, v.w / f)), nu = w / W; return { x: wx - px * nu, y: wy - py * nu, w }; };
  let anim = null;
  const animateTo = target => {
    cancelAnimationFrame(anim); const from = { ...U.mapView }, to = clamp(target);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { U.mapView = to; apply(); return; }
    const t0 = performance.now(), D = 320, ease = t => 1 - Math.pow(1 - t, 3);
    const step = now => { const t = Math.min(1, (now - t0) / D), k = ease(t); U.mapView = { x: from.x + (to.x - from.x) * k, y: from.y + (to.y - from.y) * k, w: from.w + (to.w - from.w) * k }; apply(); if (t < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  };
  if (!U.mapView) U.mapView = fit();
  apply(); U.mapApply = apply;
  U.panTo = k => {
    const P = PLACES[k]; if (!P) return; const { W, H } = size(), p = pad(), v = U.mapView, u = v.w / W;
    const sx = (P.x - v.x) / u, sy = (P.y - v.y) / u;
    if (sx > p.l && sx < W - p.r && sy > p.t && sy < H - p.b) return;
    animateTo({ x: P.x - (p.l + (W - p.l - p.r) / 2) * u, y: P.y - (p.t + (H - p.t - p.b) / 2) * u, w: v.w });
  };
  // pointers: drag to pan, two fingers to pinch
  const ptrs = new Map(); let dragged = false, total = 0, pinchD = 0;
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 1) { dragged = false; total = 0; }
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); }
    cancelAnimationFrame(anim);
  });
  svg.addEventListener('pointermove', e => {
    const prev = ptrs.get(e.pointerId); if (!prev) return;
    const cur = { x: e.clientX, y: e.clientY }; ptrs.set(e.pointerId, cur);
    const { W } = size(), u = U.mapView.w / W;
    if (ptrs.size === 1) {
      const dx = cur.x - prev.x, dy = cur.y - prev.y; total += Math.abs(dx) + Math.abs(dy);
      if (!dragged && total > 5) { dragged = true; svg.classList.add('grabbing'); try { svg.setPointerCapture(e.pointerId); } catch (_) {} }
      if (dragged) { U.mapView = { ...U.mapView, x: U.mapView.x - dx * u, y: U.mapView.y - dy * u }; apply(); }
    } else if (ptrs.size === 2) {
      dragged = true; const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD > 0) { const r = pane.getBoundingClientRect(); U.mapView = zoomAt(d / pinchD, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); apply(); }
      pinchD = d;
    }
  });
  const up = e => {
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinchD = 0;
    if (!ptrs.size) { svg.classList.remove('grabbing'); if (dragged) { U.mapDragged = true; setTimeout(() => { U.mapDragged = false; }, 0); } }
  };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => { e.preventDefault(); const [px, py] = local(e); const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)); U.mapView = zoomAt(f, px, py); apply(); }, { passive: false });
  svg.addEventListener('dblclick', e => { if (e.target.closest('.stop')) return; const [px, py] = local(e); animateTo(zoomAt(2, px, py)); });
  svg.addEventListener('keydown', e => {
    if (e.target !== svg) return; const { W, H } = size(), u = U.mapView.w / W, s = 80 * u; let t = null;
    if (e.key === 'ArrowLeft') t = { ...U.mapView, x: U.mapView.x - s }; if (e.key === 'ArrowRight') t = { ...U.mapView, x: U.mapView.x + s };
    if (e.key === 'ArrowUp') t = { ...U.mapView, y: U.mapView.y - s }; if (e.key === 'ArrowDown') t = { ...U.mapView, y: U.mapView.y + s };
    if (e.key === '+' || e.key === '=') t = zoomAt(1.6, W / 2, H / 2); if (e.key === '-' || e.key === '_') t = zoomAt(1 / 1.6, W / 2, H / 2); if (e.key === '0') t = fit();
    if (t) { e.preventDefault(); animateTo(t); }
  });
  $$('[data-zoom]').forEach(b => b.onclick = () => { const { W, H } = size(); const z = b.dataset.zoom; animateTo(z === 'fit' ? fit() : zoomAt(z === 'in' ? 1.6 : 1 / 1.6, W / 2, H / 2)); });
  if (U._mapRO) U._mapRO.disconnect();
  U._mapRO = new ResizeObserver(() => { if (document.body.contains(pane)) apply(); }); U._mapRO.observe(pane);
}

function bind(v) {
  if (v === 'setup') bindSetup();
  if (v === 'add') bindAdd();
  if (v === 'plan') bindPlan();
  if (v === 'map') bindMap();
}

// boot
(function boot() {
  applyPlaces();
  rollDay();
  if (!location.hash && !S.onboarded && !S.tasks.length) location.hash = 'setup';
  applyTheme();
  refreshPlan();
  route();
  connectStore().catch(() => setStoreMode('local'));
  if (S.settings.calendars.google) gcalPull(false);
  // the real clock: move the "now" line every minute; roll over at midnight
  setInterval(() => {
    const c = nowMin(); if (c === S.clock) return;
    S.clock = c;
    if (rollDay()) { refreshPlan(); route(); if (S.settings.calendars.google) gcalPull(false); return; }
    const busy = ($('#modalRoot') && $('#modalRoot').innerHTML) || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
    if (U.view === 'plan' && !busy && !U.loading) route();
  }, 15000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.settings.calendars.google && !GCAL.busy && GCAL.last != null && nowMin() - GCAL.last > 10) gcalPull(false); });
})();

</script>
</body></html>
